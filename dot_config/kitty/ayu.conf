# vim:ft=kitty

## name:     Ayu Dark
## author:   Based on gowall list
## license:  MIT

# --- Base ---
foreground              #E6E1CF
background              #0F1419
selection_foreground    #0F1419
selection_background    #253340

# --- Cursor ---
# Используем акцентный желтый для курсора, как в оригинальной теме
cursor                  #FFD166
cursor_text_color       #0F1419

# --- URL Hover ---
url_color               #95E6CB

# --- Window Borders ---
active_border_color     #36A3D9
inactive_border_color   #2E3338
bell_border_color       #F07178

# --- Titlebar (macOS) ---
macos_titlebar_color    #0F1419

# --- Tab Bar ---
# Стиль: активная вкладка подсвечена синим, неактивные — приглушены
tab_bar_style           fade
tab_fade                1
active_tab_foreground   #0F1419
active_tab_background   #36A3D9
active_tab_font_style   bold
inactive_tab_foreground #707a8c
inactive_tab_background #2E3338
inactive_tab_font_style normal
tab_bar_background      #0F1419

# --- Marks (search/results) ---
mark1_foreground        #0F1419
mark1_background        #95E6CB
mark2_foreground        #0F1419
mark2_background        #36A3D9
mark3_foreground        #0F1419
mark3_background        #F07178

# --- The 16 Terminal Colors ---
# Mapping based on standard Ayu Dark palette + your provided variants

# Black
color0  #000000
color8  #323232

# Red
# Используем #FF3333 для базового красного (он чище для терминала),
# а #F07178 оставим для синтаксиса в редакторах.
color1  #FF3333
color9  #FF6565

# Green
color2  #B8CC52
color10 #EAFE84

# Yellow
color3  #E7C547
color11 #FFF779

# Blue
color4  #36A3D9
color12 #68D5FF

# Magenta
color5  #EF476F
color13 #FFA3AA

# Cyan
color6  #95E6CB
color14 #C7FFFD

# White
color7  #E6E1CF
color15 #FFFFFF
