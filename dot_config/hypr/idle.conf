# Автоблокировка и выключение экрана
exec-once = swayidle -w \
  timeout 300 'swaylock -f' \          # Блокировать через 5 мин
  timeout 600 'hyprctl dispatch dpms off' \ # Выключить экран через 10 мин
  resume 'hyprctl dispatch dpms on' \      # Включить экран при активности
  before-sleep 'swaylock -f'           # Блокировать перед сном
